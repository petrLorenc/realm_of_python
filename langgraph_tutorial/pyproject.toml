[project]
name = "langgraph-tutorial"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=1.1.6",
    "langgraph>=1.0.5",
    "python-dotenv>=1.2.1",
    "langchain>=1.2.0",
    "langgraph-sdk>=0.3.1",
    "grandalf>=0.8",
    "langfuse>=3.12.0",
]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "ruff>=0.14.14",
]
server = [
    "langgraph-cli[inmem]>=0.4.12",
]
